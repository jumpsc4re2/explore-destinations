<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Subscribe to our newsletter." />
    <title>Newsletter - ExploreTheWorld 🌎</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    

    <main>
        <section id="newsletter" class="section">
            <div class="container" style="max-width: 600px; text-align: center;">
                <header class="section-header reveal">
                    <h2>Join Our Newsletter</h2>
                    <p>Get travel tips, hidden gems, and exclusive deals delivered to your inbox.</p>
                </header>
                <form class="contact-form reveal" style="margin-top: 2rem;">
                    <div class="form-row">
                        <input type="email" placeholder="Enter your email address" required style="width: 100%; padding: 1rem; border: 1px solid #ddd; border-radius: 8px;">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Subscribe Now</button>
                    <p style="margin-top: 1rem; font-size: 0.9rem; color: #666;">We respect your privacy. No spam, ever.</p>
                </form>
            </div>
        </section>
    </main>

    <script src="./layout.js"></script>
    <script src="./script.js"></script>
</body>
</html>
