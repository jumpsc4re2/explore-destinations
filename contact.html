<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Contact us." />
    <title>Contact - ExploreTheWorld 🌎</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    

    <main>
        <section id="contact" class="section">
            <div class="container">
                <header class="section-header reveal">
                    <h2>Contact</h2>
                    <p>Have a question or suggestion? Send a message.</p>
                </header>
                <form id="contact-form" class="contact-form reveal" novalidate>
                    <div class="form-row">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required />
                        <small class="error" id="error-name"></small>
                    </div>
                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required />
                        <small class="error" id="error-email"></small>
                    </div>
                    <div class="form-row">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="How can we help?" required></textarea>
                        <small class="error" id="error-message"></small>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                    <p class="form-success" id="form-success" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>

    <script src="./layout.js"></script>
    <script src="./script.js"></script>
</body>
</html>
